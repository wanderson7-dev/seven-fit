<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CuttingOS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a0a0f;color:#fff;font-family:'DM Sans',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px;}
.syne{font-family:'Syne',sans-serif;}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:20px;margin-bottom:16px;}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:14px;font-family:'DM Sans',sans-serif;}
.btn-primary{background:#f97316;color:#fff;}
.btn-ghost{background:rgba(255,255,255,0.07);color:#fff;border:1px solid rgba(255,255,255,0.12);}
.btn-danger{background:rgba(239,68,68,0.2);color:#ef4444;border:none;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px;}
input,select,textarea{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:11px 14px;color:#fff;font-size:14px;outline:none;width:100%;font-family:'DM Sans',sans-serif;}
select{background:#141420;}
textarea{resize:none;}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.3);}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;padding:8px 0 12px;z-index:100;}
.tab-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:0.35;transition:opacity 0.2s;color:#fff;font-family:'DM Sans',sans-serif;}
.tab-btn.active{opacity:1;}
.tab-btn span{font-size:18px;}
.tab-btn small{font-size:9px;font-weight:600;}
.dot{width:4px;height:4px;border-radius:50%;background:#f97316;}
.sub-tabs{display:flex;gap:8px;margin-bottom:16px;}
.sub-tab{flex:1;padding:9px 0;border-radius:12px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);}
.sub-tab.active{background:#f97316;color:#fff;}
.row{display:flex;gap:10px;align-items:center;}
.row-sb{display:flex;justify-content:space-between;align-items:center;}
.label{font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:5px;}
.small{font-size:11px;color:rgba(255,255,255,0.4);}
.food-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.set-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(255,255,255,0.04);border-radius:10px;margin-bottom:6px;}
.tag{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:700;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;overflow-y:auto;}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#141420;border-radius:20px 20px 0 0;padding:24px;padding-bottom:40px;z-index:200;}
.section-title{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.stat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.ex-item{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
.ex-item:hover{background:rgba(255,255,255,0.03);}
.workout-item{background:rgba(255,255,255,0.03);border-radius:14px;padding:12px 14px;margin-bottom:8px;}
.bar-wrap{margin-bottom:10px;}
.bar-track{height:6px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width 0.5s;}
.photo-slot{width:100%;aspect-ratio:3/4;background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.15);border-radius:12px;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:rgba(255,255,255,0.3);font-size:11px;}
.photo-slot img{width:100%;height:100%;object-fit:cover;}
.color-dot{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
.color-dot.sel{border-color:#fff;}
.hidden{display:none!important;}
.page{display:none;}
.page.active{display:block;}
</style>
</head>
<body>

<div id="app">

<!-- HEADER -->
<div style="padding:24px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;">
  <div>
    <div id="hdr-date" class="small" style="margin-bottom:2px;"></div>
    <div class="syne" style="font-size:22px;font-weight:800;letter-spacing:-0.5px;">CuttingOS <span id="hdr-dot">●</span></div>
  </div>
  <div id="hdr-day" style="background:rgba(255,255,255,0.06);border-radius:12px;padding:8px 14px;font-size:11px;font-weight:600;"></div>
</div>

<div style="padding:16px 20px;">

<!-- PAGES -->
<div id="pg-dashboard" class="page active"></div>
<div id="pg-diet" class="page"></div>
<div id="pg-workout" class="page"></div>
<div id="pg-progress" class="page"></div>
<div id="pg-settings" class="page"></div>

</div><!-- /padding -->
</div><!-- /app -->

<!-- TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="nav('dashboard')" id="tb-dashboard"><span>📊</span><small>Dash</small><div class="dot"></div></button>
  <button class="tab-btn" onclick="nav('diet')"      id="tb-diet"     ><span>🍽️</span><small>Dieta</small></button>
  <button class="tab-btn" onclick="nav('workout')"   id="tb-workout"  ><span>💪</span><small>Treino</small></button>
  <button class="tab-btn" onclick="nav('progress')"  id="tb-progress" ><span>📸</span><small>Progresso</small></button>
  <button class="tab-btn" onclick="nav('settings')"  id="tb-settings" ><span>⚙️</span><small>Config</small></button>
</div>

<!-- MODALS -->
<div id="modal-history" class="modal hidden" style="padding:20px;">
  <div style="max-width:480px;margin:0 auto;">
    <div class="row-sb" style="margin-bottom:20px;">
      <div id="mh-title" class="syne" style="font-size:18px;font-weight:700;"></div>
      <button class="btn btn-ghost" style="padding:8px 14px;" onclick="closeModal('modal-history')">Fechar</button>
    </div>
    <div id="mh-body"></div>
  </div>
</div>

<div id="modal-edit-day" class="hidden">
  <div class="modal-sheet">
    <div class="syne" style="font-size:16px;font-weight:700;margin-bottom:20px;" id="med-title"></div>
    <div class="label">Nome do treino</div>
    <input id="med-type" placeholder="Push, Pull, Legs..." style="margin-bottom:12px;"/>
    <div class="label" style="margin-top:4px;">Grupo de exercícios</div>
    <select id="med-group" style="margin-bottom:12px;">
      <option value="">— Nenhum —</option>
      <option value="Push">Push</option><option value="Pull">Pull</option>
      <option value="Legs">Legs</option><option value="Upper">Upper</option>
      <option value="Lower">Lower</option>
    </select>
    <div class="label">Calorias do dia</div>
    <select id="med-cal" style="margin-bottom:12px;">
      <option value="normal">2600 kcal — Normal</option>
      <option value="heavy">2800 kcal — Pesado</option>
      <option value="free">Livre 🍕</option>
    </select>
    <div class="label" style="margin-bottom:8px;">Cor</div>
    <div id="med-colors" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;"></div>
    <div class="row" style="gap:10px;">
      <button class="btn btn-primary" style="flex:1;" onclick="saveDayEdit()">Salvar</button>
      <button class="btn btn-ghost" style="flex:1;" onclick="closeModal('modal-edit-day')">Cancelar</button>
    </div>
  </div>
</div>

<div id="modal-scanner" class="hidden">
  <div style="position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:500;display:flex;flex-direction:column;max-width:480px;margin:0 auto;">
    <div class="row-sb" style="padding:20px 20px 10px;">
      <div class="syne" style="font-size:16px;font-weight:700;">📷 Buscar Alimento</div>
      <button class="btn btn-ghost" style="padding:8px 14px;" onclick="closeModal('modal-scanner')">✕ Fechar</button>
    </div>
    <div style="display:flex;gap:8px;padding:0 20px 12px;">
      <button id="sc-tab-barcode" onclick="setScannerTab('barcode')" style="flex:1;padding:9px 0;border-radius:12px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;background:#f97316;color:#fff;">🔢 Código de Barras</button>
      <button id="sc-tab-label" onclick="setScannerTab('label')" style="flex:1;padding:9px 0;border-radius:12px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.5);">📋 Tabela Nutricional</button>
    </div>
    <div id="sc-panel-barcode" style="flex:1;display:flex;flex-direction:column;">
      <div style="flex:1;background:#111;margin:0 20px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:rgba(255,255,255,0.4);">
        <span style="font-size:48px;">🔢</span>
        <span style="font-size:13px;text-align:center;padding:0 20px;">Digite o código de barras do produto</span>
      </div>
      <div style="padding:20px;">
        <div class="label" style="margin-bottom:8px;">Código de barras</div>
        <div class="row" style="gap:10px;">
          <input id="sc-code" type="number" placeholder="Ex: 7891000315507" style="flex:1;"/>
          <button class="btn btn-primary" style="flex-shrink:0;" onclick="doScan()">Buscar</button>
        </div>
        <div id="sc-error" style="color:#ef4444;font-size:13px;margin-top:8px;display:none;"></div>
        <div class="small" style="margin-top:10px;">Powered by Open Food Facts</div>
      </div>
    </div>
    <div id="sc-panel-label" style="flex:1;display:none;flex-direction:column;">
      <div id="label-preview-box" style="flex:1;background:#111;margin:0 20px;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:rgba(255,255,255,0.4);min-height:160px;">
        <span style="font-size:48px;">📋</span>
        <span style="font-size:13px;text-align:center;padding:0 20px;">Tire foto da tabela nutricional</span>
      </div>
      <div style="padding:20px;">
        <div class="label" style="margin-bottom:6px;">Nome do produto</div>
        <input id="label-name" placeholder="Ex: Aveia Quaker" style="margin-bottom:12px;"/>
        <div class="row" style="gap:10px;margin-bottom:12px;">
          <label style="flex:1;background:#f97316;border-radius:12px;padding:12px 0;text-align:center;font-weight:700;font-size:13px;cursor:pointer;display:block;color:#fff;font-family:'DM Sans',sans-serif;">
            📷 Fotografar
            <input id="label-img-input" type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleLabelPhoto(this)"/>
          </label>
          <label style="flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:12px 0;text-align:center;font-weight:700;font-size:13px;cursor:pointer;display:block;color:#fff;font-family:'DM Sans',sans-serif;">
            🖼️ Galeria
            <input id="label-gallery-input" type="file" accept="image/*" style="display:none;" onchange="handleLabelPhoto(this)"/>
          </label>
        </div>
        <button id="label-analyze-btn" class="btn btn-primary" style="width:100%;display:none;" onclick="analyzeLabel()">🤖 Analisar com IA</button>
        <div id="label-status" style="margin-top:10px;font-size:13px;display:none;text-align:center;"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── DB ───────────────────────────────────────────────────────────────────────
const DB = {
  get(k){ try{ const v=localStorage.getItem('co_'+k); return v?JSON.parse(v):null; }catch{return null;} },
  set(k,v){ try{ localStorage.setItem('co_'+k,JSON.stringify(v)); }catch(e){console.error(e);} }
};

// ── STATE ────────────────────────────────────────────────────────────────────
const PROFILE = {weight:87,tdee:3402,goal_bf:12,current_bf:19};
const DEFAULT_TARGETS = {
  normal:{kcal:2600,protein:157,carbs:290,fat:70},
  heavy:{kcal:2800,protein:157,carbs:330,fat:70}
};
const MEAL_PLAN = {
  normal:[
    {time:"09:00",name:"Café da Manhã",foods:["4 ovos inteiros","2 fatias pão integral","1 banana","150g iogurte grego desnatado"],kcal:620},
    {time:"12:00",name:"Pré-Treino",foods:["30g Whey","1 fruta"],kcal:200},
    {time:"17:30",name:"Almoço / Pós-Treino",foods:["200g frango grelhado","250g arroz branco","Salada à vontade"],kcal:780},
    {time:"20:30",name:"Jantar",foods:["180g frango grelhado","150g batata doce","1 ovo + fio de azeite"],kcal:620}
  ],
  heavy:[
    {time:"09:00",name:"Café da Manhã",foods:["4 ovos inteiros","3 fatias pão integral","1 banana","150g iogurte grego desnatado"],kcal:700},
    {time:"12:00",name:"Pré-Treino",foods:["30g Whey","1 banana","1 maçã"],kcal:260},
    {time:"17:30",name:"Almoço / Pós-Treino",foods:["200g frango grelhado","300g arroz branco","Salada à vontade"],kcal:880},
    {time:"20:30",name:"Jantar",foods:["180g frango grelhado","200g batata doce","1 ovo + fio de azeite"],kcal:700}
  ]
};
const DEFAULT_EXERCISES = {
  Push:["Supino Reto","Supino Inclinado","Crucifixo","Desenvolvimento","Elevação Lateral","Tríceps Corda","Tríceps Testa","Tríceps Francês"],
  Pull:["Puxada Frente","Puxada Neutra","Remada Curvada","Remada Unilateral","Rosca Direta","Rosca Martelo","Face Pull","Pullover"],
  Legs:["Agachamento Livre","Leg Press","Cadeira Extensora","Mesa Flexora","Stiff","Avanço","Panturrilha em Pé","Panturrilha Sentado"],
  Upper:["Supino Reto","Desenvolvimento","Elevação Lateral","Puxada Frente","Remada Curvada","Rosca Direta","Tríceps Corda"],
  Lower:["Agachamento Livre","Leg Press","Cadeira Extensora","Mesa Flexora","Stiff","Panturrilha em Pé"]
};
const DEFAULT_SCHEDULE = [
  {day:"Seg",type:"Push",color:"#f97316",calType:"normal",group:"Push"},
  {day:"Ter",type:"Pull",color:"#3b82f6",calType:"normal",group:"Pull"},
  {day:"Qua",type:"Legs 🦵",color:"#8b5cf6",calType:"heavy",group:"Legs"},
  {day:"Qui",type:"Jiu-Jitsu 🥋",color:"#10b981",calType:"normal",group:"Upper"},
  {day:"Sex",type:"Upper",color:"#f59e0b",calType:"normal",group:"Upper"},
  {day:"Sab",type:"Lower 🦵",color:"#ec4899",calType:"heavy",group:"Lower"},
  {day:"Dom",type:"Descanso 🍕",color:"#6b7280",calType:"free",group:null}
];
const DEFAULT_FOODS = [
  {id:"f1",name:"Frango Grelhado",kcal:165,protein:31,carbs:0,fat:3.6,unit:"100g"},
  {id:"f2",name:"Arroz Branco Cozido",kcal:130,protein:2.7,carbs:28,fat:0.3,unit:"100g"},
  {id:"f3",name:"Batata Doce Cozida",kcal:86,protein:1.6,carbs:20,fat:0.1,unit:"100g"},
  {id:"f4",name:"Ovo Inteiro",kcal:155,protein:13,carbs:1.1,fat:11,unit:"100g"},
  {id:"f5",name:"Whey Protein",kcal:120,protein:24,carbs:3,fat:2,unit:"30g"},
  {id:"f6",name:"Iogurte Grego Desnatado",kcal:59,protein:10,carbs:3.6,fat:0.4,unit:"100g"},
  {id:"f7",name:"Pão Integral",kcal:247,protein:9,carbs:41,fat:3.4,unit:"100g"},
  {id:"f8",name:"Banana",kcal:89,protein:1.1,carbs:23,fat:0.3,unit:"100g"},
  {id:"f9",name:"Patinho / Coxão Mole",kcal:158,protein:28,carbs:0,fat:5,unit:"100g"},
  {id:"f10",name:"Azeite de Oliva",kcal:884,protein:0,carbs:0,fat:100,unit:"100ml"}
];
const COLORS = ["#f97316","#3b82f6","#8b5cf6","#10b981","#f59e0b","#ec4899","#6b7280","#ef4444"];
const SET_TYPES = [{id:"aquecimento",label:"Aquecimento",emoji:"🔥",color:"#f59e0b"},{id:"valida",label:"Válida",emoji:"✅",color:"#10b981"}];

let state = {
  foodLogs: DB.get('foodLogs')||[],
  workoutLogs: DB.get('workoutLogs')||[],
  weightLogs: DB.get('weightLogs')||[],
  customFoods: DB.get('customFoods')||[],
  customExercises: DB.get('customExercises')||{},
  schedule: DB.get('schedule')||DEFAULT_SCHEDULE,
  progressPhotos: DB.get('progressPhotos')||[],
  // session state
  activeEx: null,
  currentSets: [],
  sessionExs: [],
  swapFor: null,
  dietSub: 'log',
  workoutSub: 'session',
  progressSub: 'weight',
  foodSearch: '',
  selectedFood: null,
  editDayIdx: null,
  editDayColor: null,
  pendingImages: {Frente:null,Lado:null,Costas:null},
};

function saveState() {
  DB.set('foodLogs', state.foodLogs);
  DB.set('workoutLogs', state.workoutLogs);
  DB.set('weightLogs', state.weightLogs);
  DB.set('customFoods', state.customFoods);
  DB.set('customExercises', state.customExercises);
  DB.set('schedule', state.schedule);
  DB.set('progressPhotos', state.progressPhotos);
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
const today = () => new Date().toISOString().slice(0,10);
const getDOW = () => ["Dom","Seg","Ter","Qua","Qui","Sex","Sab"][new Date().getDay()];
const fmtDate = d => { try{ return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); }catch{return d;} };
function todaySched(){ return state.schedule.find(s=>s.day===getDOW())||state.schedule[6]; }
function getTargets(){ const s=todaySched(); return s.calType==='heavy'?DEFAULT_TARGETS.heavy:s.calType==='free'?{kcal:9999,protein:0,carbs:0,fat:0}:DEFAULT_TARGETS.normal; }
function todayFoodLogs(){ return state.foodLogs.filter(l=>l.date===today()); }
function getTotals(logs){ return logs.reduce((a,l)=>({kcal:a.kcal+l.kcal,protein:a.protein+(l.protein||0),carbs:a.carbs+(l.carbs||0),fat:a.fat+(l.fat||0)}),{kcal:0,protein:0,carbs:0,fat:0}); }
function allFoods(){ return [...DEFAULT_FOODS,...state.customFoods]; }
function getExercises(group){ if(!group)return[]; return [...new Set([...(DEFAULT_EXERCISES[group]||[]),...(state.customExercises[group]||[])])]; }
function ring(val,max,color,size,stroke,label){
  const r=(size-stroke)/2,circ=2*Math.PI*r,dash=Math.min(val/Math.max(max,1),1)*circ;
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
    </svg>
    <div style="margin-top:-${size*0.62}px;text-align:center;pointer-events:none;">
      <div style="font-size:${size*0.18}px;font-weight:700;color:#fff;font-family:'Syne',sans-serif;">${val}</div>
      <div style="font-size:${size*0.13}px;color:rgba(255,255,255,0.5);">/${max}</div>
    </div>
    <div style="font-size:11px;color:rgba(255,255,255,0.7);font-weight:600;margin-top:${size*0.6}px;">${label}</div>
  </div>`;
}
function bar(val,max,color,label,unit=''){
  const pct=Math.min((val/Math.max(max,1))*100,100);
  return `<div class="bar-wrap"><div class="row-sb" style="font-size:12px;margin-bottom:4px;"><span style="color:rgba(255,255,255,0.7);">${label}</span><span style="color:#fff;">${val}${unit} <span style="color:rgba(255,255,255,0.4);">/ ${max}${unit}</span></span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div></div>`;
}
function statCard(icon,label,value,sub,color){
  return `<div class="stat-card"><div style="font-size:20px;margin-bottom:8px;">${icon}</div><div style="font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:4px;">${label}</div><div class="syne" style="font-size:18px;font-weight:700;color:${color};">${value}</div><div class="small" style="margin-top:2px;">${sub}</div></div>`;
}

// ── NAV ──────────────────────────────────────────────────────────────────────
let currentPage = 'dashboard';
function nav(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>{ b.classList.remove('active'); const d=b.querySelector('.dot'); if(d)d.remove(); });
  document.getElementById('pg-'+page).classList.add('active');
  const tb=document.getElementById('tb-'+page);
  tb.classList.add('active');
  if(!tb.querySelector('.dot')){ const d=document.createElement('div'); d.className='dot'; tb.appendChild(d); }
  currentPage=page;
  renderPage(page);
}
function renderPage(p){ window['render_'+p]&&window['render_'+p](); }

// ── HEADER ───────────────────────────────────────────────────────────────────
function renderHeader(){
  const s=todaySched();

// ── DASHBOARD ────────────────────────────────────────────────────────────────

          ${ring(Math.round(tot.carbs),t.carbs,'#8b5cf6',68,7,'Carbo')}

      <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:10px;">Progresso até ${PROFILE.goal_bf}% BF</div>

    </div>

      <div class="row" style="gap:10px;"><input id="inp-weight" type="number" placeholder="${lastW} kg" style="flex:1;"/><button class="btn btn-primary" onclick="saveWeight()">Salvar</button></div>

function saveWeight(){
  const v=parseFloat(document.getElementById('inp-weight').value);

  state.weightLogs.push({date:today(),value:v});
  saveState();render_dashboard();

function dietSub(s){state.dietSub=s;state.foodSearch='';state.selectedFood=null;render_diet();}
function foodSearchInput(v){state.foodSearch=v;state.selectedFood=null;render_diet();setTimeout(()=>{const el=document.getElementById('food-search');if(el){el.value=v;el.focus();el.setSelectionRange(v.length,v.length);}},10);}
function selectFood(id){state.selectedFood=allFoods().find(f=>f.id===id);render_diet();}
function addFoodLog(){
  const f=state.selectedFood;if(!f)return;
  const qty=parseFloat(document.getElementById('food-qty').value)||100;
  const r=qty/100;
  state.foodLogs.push({id:Date.now(),date:today(),foodName:f.name,qty,kcal:Math.round(f.kcal*r),protein:Math.round(f.protein*r*10)/10,carbs:Math.round(f.carbs*r*10)/10,fat:Math.round(f.fat*r*10)/10});
  state.selectedFood=null;state.foodSearch='';saveState();render_diet();
}
function removeFood(id){state.foodLogs=state.foodLogs.filter(l=>l.id!==id);saveState();render_diet();}
function saveCustomFood(){
  const name=document.getElementById('nf-name').value.trim();
  const kcal=parseFloat(document.getElementById('nf-kcal').value);
  if(!name||isNaN(kcal))return;
  state.customFoods.push({id:'c'+Date.now(),name,kcal,protein:parseFloat(document.getElementById('nf-protein').value)||0,carbs:parseFloat(document.getElementById('nf-carbs').value)||0,fat:parseFloat(document.getElementById('nf-fat').value)||0,unit:'100g'});
  saveState();render_diet();
}
function setHistDietDate(d){state.histDietDate=d;render_diet();}

// ── SCANNER ──────────────────────────────────────────────────────────────────
function openScanner(){document.getElementById('modal-scanner').classList.remove('hidden');}
async function doScan(){
  const code=document.getElementById('sc-code').value.trim();
  const errEl=document.getElementById('sc-error');
  if(!code){errEl.textContent='Digite o código.';errEl.style.display='block';return;}
  errEl.style.display='none';
  const btn=event.target;btn.textContent='Buscando...';btn.disabled=true;
  try{
    const proxies=[
      `https://api.allorigins.win/get?url=${encodeURIComponent('https://world.openfoodfacts.org/api/v0/product/'+code+'.json')}`,
      `https://corsproxy.io/?${encodeURIComponent('https://world.openfoodfacts.org/api/v0/product/'+code+'.json')}`
    ];
    let food=null;
    for(const url of proxies){
      try{
        const res=await fetch(url,{signal:AbortSignal.timeout(8000)});
        const wrapper=await res.json();
        const data=typeof wrapper.contents==='string'?JSON.parse(wrapper.contents):wrapper;
        if(data.status===1){
          const p=data.product,n=p.nutriments||{};
          food={id:'scan_'+code,name:p.product_name||p.generic_name||'Produto escaneado',
            kcal:Math.round(n['energy-kcal_100g']||(n['energy_100g']||0)/4.184||0),
            protein:Math.round((n.proteins_100g||0)*10)/10,carbs:Math.round((n.carbohydrates_100g||0)*10)/10,
            fat:Math.round((n.fat_100g||0)*10)/10,unit:'100g',scanned:true};
          break;
        }
      }catch(e){continue;}
    }
    if(food){
      if(!state.customFoods.find(f=>f.id===food.id)) state.customFoods.push(food);
      state.selectedFood=food;state.foodSearch=food.name;
      saveState();closeModal('modal-scanner');render_diet();
    } else { errEl.textContent='Produto não encontrado. Verifique o código.';errEl.style.display='block'; }
  }catch(e){errEl.textContent='Erro de conexão.';errEl.style.display='block';}
  btn.textContent='Buscar';btn.disabled=false;
}

async function analyzeLabel() {
  if (!labelImageB64) return;
  const btn = document.getElementById('label-analyze-btn');
  const st = document.getElementById('label-status');
  btn.disabled = true; btn.textContent = '⏳ Analisando...';
  st.style.display = 'block'; st.style.color = 'rgba(255,255,255,0.5)';
  st.textContent = 'Enviando imagem para o Claude...';

  try {
    // Extract base64 data (remove data:image/...;base64, prefix)
    const b64data = labelImageB64.split(',')[1];
    const mimeMatch = labelImageB64.match(/data:([^;]+);base64,/);
    const mimeType = mimeMatch ? mimeMatch[1] : 'image/jpeg';

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: mimeType, data: b64data }
            },
            {
              type: 'text',
              text: `Você é um leitor de tabelas nutricionais. Analise esta imagem e extraia os valores nutricionais POR 100g do produto.
Responda SOMENTE em JSON válido, sem texto adicional, sem markdown, sem explicações:
{"name":"nome do produto ou vazio se não aparecer","kcal":0,"protein":0,"carbs":0,"fat":0}
Onde os valores são números decimais por 100g. Se não conseguir ler algum valor, use 0.`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || 'Erro na API');

    const text = data.content?.find(b => b.type === 'text')?.text || '';
    // Parse JSON - handle possible surrounding whitespace
    const clean = text.trim().replace(/^```json?/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(clean);

    const productName = document.getElementById('label-name').value.trim() || parsed.name || 'Produto lido por IA';
    const food = {
      id: 'ai_' + Date.now(),
      name: productName,
      kcal: Math.round(parsed.kcal || 0),
      protein: Math.round((parsed.protein || 0) * 10) / 10,
      carbs: Math.round((parsed.carbs || 0) * 10) / 10,
      fat: Math.round((parsed.fat || 0) * 10) / 10,
      unit: '100g',
      scanned: true,
      aiRead: true
    };

    if (!state.customFoods.find(f => f.id === food.id)) state.customFoods.push(food);
    state.selectedFood = food;
    state.foodSearch = food.name;
    saveState();
    closeModal('modal-scanner');
    render_diet();
    labelImageB64 = null;

  } catch(e) {
    console.error(e);
    st.style.color = '#ef4444';
    st.textContent = 'Erro ao analisar. Tente uma foto mais nítida da tabela.';
    btn.disabled = false; btn.textContent = '🤖 Analisar com IA';
  }
}

</script>
</body>
</html>
